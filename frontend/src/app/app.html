<mat-toolbar color="primary" class="app-toolbar">
  <button mat-icon-button (click)="toggleSidenav()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="toolbar-title">{{ title() }}</span>
  <span class="toolbar-spacer"></span>
  <button mat-icon-button routerLink="/dashboard" routerLinkActive="active-link">
    <mat-icon>dashboard</mat-icon>
  </button>
  <button mat-icon-button routerLink="/upload" routerLinkActive="active-link">
    <mat-icon>upload_file</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="app-container">
  <mat-sidenav
    #sidenav
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    class="app-sidenav">
    <nav class="app-nav">
      <a mat-button routerLink="/dashboard" routerLinkActive="active-link" (click)="closeSidenavOnMobile()">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a mat-button routerLink="/upload" routerLinkActive="active-link" (click)="closeSidenavOnMobile()">
        <mat-icon>upload_file</mat-icon>
        <span>Batch Upload</span>
      </a>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="app-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
