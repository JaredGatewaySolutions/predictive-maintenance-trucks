<mat-toolbar color="primary" class="app-toolbar">
  <button mat-icon-button>
    <mat-icon>menu</mat-icon>
  </button>
  <span class="toolbar-title">{{ title() }}</span>
  <span class="toolbar-spacer"></span>
  <button mat-icon-button routerLink="/dashboard" routerLinkActive="active-link">
    <mat-icon>dashboard</mat-icon>
  </button>
  <button mat-icon-button routerLink="/upload" routerLinkActive="active-link">
    <mat-icon>upload_file</mat-icon>
  </button>
</mat-toolbar>

<div class="app-container">
  <nav class="app-nav">
    <a mat-button routerLink="/dashboard" routerLinkActive="active-link">
      <mat-icon>dashboard</mat-icon>
      Dashboard
    </a>
    <a mat-button routerLink="/upload" routerLinkActive="active-link">
      <mat-icon>upload_file</mat-icon>
      Batch Upload
    </a>
  </nav>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
